<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قرآن پاک — ایڈمن پینل</title>
  <link rel="stylesheet" href="2.css">
</head>
<body>

<header>
  <h1>قرآن پاک — ایڈمن پینل</h1>
</header>

<main>
  <section class="card" id="adminLogin">
    <h2>ایڈمن لاگ اِن</h2>
<label for="adminEmail">ای میل</label>
<input
  type="email"
  id="adminEmail"
  placeholder="ای میل"
  autocomplete="username"
  dir="ltr"
  style="text-align: left;"
  required
>
<label for="adminPassword">پاس ورڈ</label>

<div class="password-wrapper">
  <input
    type="password"
    id="adminPassword"
    placeholder="پاس ورڈ"
    autocomplete="current-password"
    required
  >

  <button
    type="button"
    id="toggleAdminPassword"
    class="eye-btn"
    aria-label="پاس ورڈ دکھائیں"
    aria-pressed="false"
  >👁️</button>
</div>

    <button type="button" id="adminLoginBtn">لاگ اِن کریں</button>
    <p id="adminMsg" role="status"></p>
  </section>

  <section class="card" id="dashboard" hidden>
    <h2>ادائیگی کی درخواستیں</h2>

    <button type="button" id="refreshRequests">
      درخواستیں ریفریش کریں
    </button>

    <button type="button" id="adminLogout">
      لاگ آؤٹ
    </button>

    <p id="dashboardMsg" role="status"></p>
    <div id="requestsList"></div>
  </section>
</main>

<script type="module" src="2.js"></script>
</body>
</html>
